<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Voting - 100 Point Allocation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .instructions {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .points-remaining {
            background: #edf2f7;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .points-remaining .label {
            color: #718096;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .points-remaining .amount {
            font-size: 36px;
            font-weight: bold;
            color: #2d3748;
        }
        
        .points-remaining.warning .amount {
            color: #e53e3e;
        }
        
        .points-remaining.complete .amount {
            color: #38a169;
        }
        
        .essay-item {
            margin-bottom: 20px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .essay-item:hover {
            border-color: #cbd5e0;
        }
        
        .essay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .essay-name {
            font-weight: 600;
            color: #2d3748;
            font-size: 16px;
        }
        
        .essay-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 5px;
        }
        
        .essay-link:hover {
            text-decoration: underline;
        }
        
        .essay-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="number"] {
            width: 100px;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            font-weight: 600;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fff5f5;
            border: 2px solid #fc8181;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
        
        .success-message {
            background: #f0fff4;
            border: 2px solid #68d391;
            color: #22543d;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
        
        .success-message h3 {
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Evaluation Voting Form</h1>
        <p class="instructions">
            Distribute 100 points across the 14 evaluations below based on their quality. 
            You can give any evaluation between 0-100 points, but your total must equal exactly 100.
        </p>
        
        <div class="points-remaining" id="pointsDisplay">
            <div class="label">Points Remaining</div>
            <div class="amount" id="remainingPoints">100</div>
        </div>
        
        <form id="votingForm">
            <label for="voterName">Your Name:</label>
            <input type="text" id="voterName" placeholder="Enter your name" required>
            
            <div id="essayInputs"></div>
            
            <div class="submit-section">
                <label for="comments">Additional Comments (Optional):</label>
                <textarea id="comments" placeholder="Any additional thoughts or notes about your rankings..."></textarea>
                
                <button type="submit" id="submitBtn" disabled>Submit Votes</button>
                <div id="errorMessage" style="display: none;"></div>
                <div id="successMessage" style="display: none;"></div>
            </div>
        </form>
    </div>
    
    <script>
        const essays = [
            {
                title: "Asymmetry in Civic Information: An Experiment on Tax Participation among Informal Firms in Togo",
                link: "https://unjournal.pubpub.org/pub/evalsumcivicasymmetry/release/3"
            },
            {
                title: "Cash Transfers for Child Development: Experimental Evidence from India",
                link: "https://unjournal.pubpub.org/pub/evalsummaternalcashtransfers/release/2"
            },
            {
                title: "Does online fundraising increase charitable giving? A nationwide field experiment on Facebook",
                link: "https://unjournal.pubpub.org/pub/evalsumfundraisingcharitablegiving/release/1"
            },
            {
                title: "Ends versus Means: Kantians, Utilitarians, and Moral Decisions",
                link: "https://unjournal.pubpub.org/pub/evalsumendsversusmeans/release/1"
            },
            {
                title: "Forecasts estimate limited cultured meat production through 2050",
                link: "https://unjournal.pubpub.org/pub/evalsumlimitedmeadprod/release/1"
            },
            {
                title: "Global potential for natural regeneration in deforested tropical regions",
                link: "https://unjournal.pubpub.org/pub/evalsumnaturalregeneration/release/3"
            },
            {
                title: "Meaningfully reducing consumption of meat and animal products is an unsolved problem: A meta-analysis",
                link: "https://unjournal.pubpub.org/pub/evalsumreducingconsumption/release/12"
            },
            {
                title: "Social Safety Nets, Women's Economic Achievements and Agency",
                link: "https://unjournal.pubpub.org/pub/evalsumsafetynets/release/1"
            },
            {
                title: "The Macroeconomic Impact of Climate Change: Global vs. Local Temperature",
                link: "https://unjournal.pubpub.org/pub/evalsummacroclimatechange/release/5"
            },
            {
                title: "The Returns to Science In the Presence of Technological Risks",
                link: "https://unjournal.pubpub.org/pub/evalsumtechnologicalrisks/release/5"
            },
            {
                title: "The wellbeing cost-effectiveness of StrongMinds and Friendship Bench: Combining a systematic review and meta-analysis with charity-related data",
                link: "https://unjournal.pubpub.org/pub/evalsumstrongminds/release/5"
            },
            {
                title: "Universal Basic Income: Short-Term Results from a Long-Term Experiment in Kenya",
                link: "https://unjournal.pubpub.org/pub/evalsumuniversalincome/release/6"
            },
            {
                title: "Water treatment and child mortality: A meta-analysis and cost-effectiveness analysis",
                link: "https://unjournal.pubpub.org/pub/evalsumwatertreatment/release/4"
            },
            {
                title: "Willful Ignorance and Moral Behavior",
                link: "https://unjournal.pubpub.org/pub/evalsummoralbhvr/release/3"
            }
        ];
        const essayInputsContainer = document.getElementById('essayInputs');
        const remainingPointsEl = document.getElementById('remainingPoints');
        const pointsDisplayEl = document.getElementById('pointsDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessageEl = document.getElementById('errorMessage');
        const successMessageEl = document.getElementById('successMessage');
        const form = document.getElementById('votingForm');
        
        // Create input fields for each essay
        essays.forEach((essay, index) => {
            const essayDiv = document.createElement('div');
            essayDiv.className = 'essay-item';
            essayDiv.innerHTML = `
                <div class="essay-header">
                    <div>
                        <div class="essay-name">${essay.title}</div>
                        <a href="${essay.link}" target="_blank" class="essay-link">View evaluation →</a>
                    </div>
                </div>
                <div class="essay-input">
                    <input 
                        type="number" 
                        id="essay${index}" 
                        min="0" 
                        max="100" 
                        value="0"
                        data-essay="${essay.title}"
                    >
                    <span>points</span>
                </div>
            `;
            essayInputsContainer.appendChild(essayDiv);
        });
        
        // Calculate remaining points
        function updateRemainingPoints() {
            let total = 0;
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                total += parseInt(input.value) || 0;
            });
            
            const remaining = 100 - total;
            remainingPointsEl.textContent = remaining;
            
            // Update styling based on remaining points
            pointsDisplayEl.classList.remove('warning', 'complete');
            if (remaining < 0) {
                pointsDisplayEl.classList.add('warning');
                submitBtn.disabled = true;
            } else if (remaining === 0) {
                pointsDisplayEl.classList.add('complete');
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
            
            return remaining;
        }
        
        // Add event listeners to all number inputs
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', updateRemainingPoints);
        });
        
        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const remaining = updateRemainingPoints();
            if (remaining !== 0) {
                errorMessageEl.textContent = `You must allocate exactly 100 points. Currently: ${100 - remaining} points allocated.`;
                errorMessageEl.style.display = 'block';
                errorMessageEl.className = 'error-message';
                return;
            }
            
            errorMessageEl.style.display = 'none';
            
            // Collect form data
            const voterName = document.getElementById('voterName').value;
            const comments = document.getElementById('comments').value;
            const votes = {};
            
            document.querySelectorAll('input[type="number"]').forEach(input => {
                votes[input.dataset.essay] = parseInt(input.value) || 0;
            });
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            try {
                // Send to Google Sheets
                const response = await fetch('https://script.google.com/macros/s/AKfycbyHk-dsnc5wgo3NvcmvMXOsQ90SBV9M0c2_HH-FWZuCKDk0wPh_JD547xCVoOCvaBs/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ voterName, votes, comments })
                });
                
                // Display success message
                successMessageEl.innerHTML = `
                    <h3>✓ Votes Recorded Successfully!</h3>
                    <p><strong>Voter:</strong> ${voterName}</p>
                    <p style="margin-top: 10px;">Your votes have been submitted to the Google Sheet.</p>
                `;
                successMessageEl.style.display = 'block';
                successMessageEl.className = 'success-message';
                
                // Disable form after submission
                submitBtn.textContent = 'Votes Submitted';
                
            } catch (error) {
                errorMessageEl.textContent = 'There was an error submitting your votes. Please try again.';
                errorMessageEl.style.display = 'block';
                errorMessageEl.className = 'error-message';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Votes';
                console.error('Submission error:', error);
            }
        });
    </script>
</body>
</html>
